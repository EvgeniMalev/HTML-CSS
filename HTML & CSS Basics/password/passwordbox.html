<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Field Example</title>
    <style>
        .form-group {
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 250px;
        }
    </style>
</head>
<body>

    <div class="form-group">
       
        <label Kabal="user-password">Password:</label>
        
        
        <input 
            type="password" 
            id="user-password" 
            name="password" 
            placeholder="Enter your password" 
            required
        >
    </div>

</body>
</html>
