<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лунен календар</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0d1b2a;
    color: white;
    text-align: center;
    padding-top: 50px;
}

.container {
    width: 400px;
    margin: auto;
    background: #1b263b;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 15px #415a77;
}

.moon {
    font-size: 100px;
    margin: 20px;
}

h1 {
    color: #ffd60a;
}
</style>
</head>

<body>

<div class="container">
    <h1>Лунен календар</h1>
    <h2 id="date"></h2>
    <div class="moon" id="moon">🌑</div>
    <h3 id="phase"></h3>
</div>

<script>
const phases = [
    "🌑 Новолуние",
    "🌒 Нарастващ сърп",
    "🌓 Първа четвърт",
    "🌔 Нарастваща луна",
    "🌕 Пълнолуние",
    "🌖 Намаляваща луна",
    "🌗 Последна четвърт",
    "🌘 Намаляващ сърп"
];

const moonIcons = ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];

function getMoonPhase() {
    const now = new Date();

    const knownNewMoon = new Date("2024-01-11");
    const lunarCycle = 29.53058867;

    const diffDays =
        (now - knownNewMoon) / (1000 * 60 * 60 * 24);

    const moonAge =
        ((diffDays % lunarCycle) + lunarCycle) % lunarCycle;

    const phaseIndex =
        Math.floor((moonAge / lunarCycle) * 8);

    document.getElementById("moon").innerHTML =
        moonIcons[phaseIndex];

    document.getElementById("phase").innerHTML =
        phases[phaseIndex];
}

document.getElementById("date").innerHTML =
    new Date().toLocaleDateString("bg-BG");

getMoonPhase();
</script>

</body>
</html>
