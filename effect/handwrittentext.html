<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Ръкописен ефект</title>

<style>
body{
    background:#f5f0e6;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.text{
    font-size:40px;
    font-family:"Comic Sans MS", cursive;
    color:#1a1a1a;
    overflow:hidden;
    white-space:nowrap;
    border-right:3px solid #000;
    width:0;
    animation:
        typing 6s steps(35,end) forwards,
        cursor 0.8s infinite;
}

@keyframes typing{
    from{width:0}
    to{width:100%}
}

@keyframes cursor{
    50%{border-color:transparent;}
}
</style>

</head>
<body>

<div class="text">
Добре дошли в света на HTML ефектите!
</div>

</body>
</html>
