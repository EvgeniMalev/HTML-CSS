<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Ефект Пишеща машина</title>

<style>
body {
    background-color: #111;
    color: #00ff00;
    font-family: Consolas, monospace;
    padding: 40px;
    font-size: 28px;
}

#text {
    border-right: 3px solid #00ff00;
    white-space: nowrap;
    overflow: hidden;
}
</style>

</head>
<body>

<div id="text"></div>

<script>
const message = "Добре дошли в моя HTML проект!";
const speed = 100; // милисекунди

let i = 0;

function typeWriter() {
    if (i < message.length) {
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
    }
}

typeWriter();
</script>

</body>
</html>
