<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Мигащ курсор</title>

<style>
body{
    background:#222;
    color:white;
    font-size:40px;
    font-family:Consolas, monospace;
    padding:50px;
}

.cursor{
    animation: blink 0.8s infinite;
}

@keyframes blink{
    0%, 50%{
        opacity:1;
    }
    51%, 100%{
        opacity:0;
    }
}
</style>

</head>
<body>

<span>blinktext</span><span class="cursor">|</span>

</body>
