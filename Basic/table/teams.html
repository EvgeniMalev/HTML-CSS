<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Класиране на футболни отбори</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
}

table{
    width:70%;
    margin:40px auto;
    border-collapse:collapse;
    background:white;
}

th, td{
    border:1px solid #000;
    padding:10px;
    text-align:center;
}

th{
    background:#2E8B57;
    color:white;
}

.title{
    background:#006400;
    font-size:24px;
}

.note{
    background:#E8F5E9;
    font-style:italic;
}
</style>

</head>

<body>

<table>

<tr>
    <th colspan="6" class="title">
        Общинско футболно първенство
    </th>
</tr>

<tr>
    <th>Отбор</th>
    <th>Мачове</th>
    <th>Победи</th>
    <th>Равенства</th>
    <th>Загуби</th>
    <th>Точки</th>
</tr>

<tr>
    <td>Земеделец 93 (Козловец)</td>
    <td>18</td>
    <td>12</td>
    <td>4</td>
    <td>2</td>
    <td>40</td>
</tr>

<tr>
    <td>Изгрев (Царевец)</td>
    <td>18</td>
    <td>10</td>
    <td>5</td>
    <td>3</td>
    <td>35</td>
</tr>

<tr>
    <td rowspan="2"><strong>Лидер</strong></td>
    <td colspan="5" class="note">
        Земеделец 93 (Козловец) е на първо място във временното класиране.
    </td>
</tr>

<tr>
    <td colspan="5" class="note">
        Следващият мач е между Земеделец 93 (Козловец) и Изгрев (Царевец).
    </td>
</tr>

</table>

</body>
</html>
